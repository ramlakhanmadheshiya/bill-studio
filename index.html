<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bill Studio</title>
  <meta name="description" content="Bill Studio — beautiful, free, offline billing for every business in the world. GST, VAT and sales-tax invoices, dues tracking and reports. Your data never leaves your device.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bill Studio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // Light by default; 'system' follows the OS, 'dark' forces dark.
    try { const t = localStorage.getItem('bs-theme') || 'light'; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div id="app"><div style="min-height:100vh;display:grid;place-items:center;color:#86868b;font:15px -apple-system,system-ui,sans-serif">Loading Bill Studio…</div></div>
  <div id="print-root"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Bill Studio needs JavaScript enabled.</p></noscript>
  <script src="assets/vendor/qrcode.js" defer></script>
  <script src="assets/vendor/html2canvas.min.js" defer></script>
  <script src="assets/vendor/jspdf.umd.min.js" defer></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
